<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>新しい話題｜組合員専用ページ</title>
<style>
:root { --ink:#14273a; --steel:#1f4e79; --deep:#0f2740; --line:#d5dde6; --mist:#f1f4f8; --paper:#fff; --sub:#55677a; --primer:#b0432c; --ok:#2c7566; }
* { box-sizing: border-box; }
body { margin:0; background:var(--mist); color:var(--ink); font:16px/1.7 "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif; }
a { color:var(--steel); }
.bar { background:var(--deep); color:#fff; }
.bar .in { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 20px; padding-block:14px; }
.bar strong { font-size:18px; letter-spacing:.04em; }
.bar small { display:block; font-size:12px; color:#b9c9d8; }
.bar nav { display:flex; flex-wrap:wrap; align-items:center; gap:6px 18px; font-size:14px; }
.bar a { color:#fff; }
.bar form { margin:0; }
.who { font-size:13px; color:#d6e2ee; }
.tabs { background:var(--steel); border-bottom:4px solid var(--primer); }
.tabs .in { display:flex; flex-wrap:wrap; gap:2px; }
.tabs a { color:#fff; text-decoration:none; font-weight:700; font-size:15px; padding:11px 16px; }
.tabs a:hover { background:rgba(255,255,255,.12); }
.tabs a.on { background:var(--paper); color:var(--steel); }
.in { max-width:1040px; margin-inline:auto; padding-inline:20px; }
main.in { padding-block:28px 60px; }
h1 { font-size:24px; margin:0 0 16px; line-height:1.4; overflow-wrap:anywhere; }
h2 { font-size:18px; margin:0 0 12px; line-height:1.5; }
.card { background:var(--paper); border:1px solid var(--line); padding:22px; margin-bottom:20px; min-width:0; }
.card.admin { border-left:5px solid var(--primer); }
.narrow { max-width:520px; margin-inline:auto; }
.msg { padding:12px 16px; margin-bottom:16px; border-left:5px solid var(--ok); background:#e9f4f1; overflow-wrap:anywhere; }
.msg.err { border-color:var(--primer); background:#fbece8; }
.msg.big { font-size:17px; }
.msg.big b { font-family:Consolas,"Courier New",monospace; font-size:20px; letter-spacing:.06em; background:#fff; padding:2px 8px; border:1px solid var(--line); }
.btn { display:inline-block; font-family:inherit; font-weight:700; font-size:15px; line-height:1; padding:12px 18px; border:1px solid var(--steel); background:var(--steel); color:#fff; border-radius:4px; cursor:pointer; text-decoration:none; }
.btn:hover { background:var(--deep); }
.btn.line { background:#fff; color:var(--steel); }
.btn.line:hover { background:var(--mist); }
.btn.danger { background:var(--primer); border-color:var(--primer); }
.btn.sm { font-size:13px; padding:8px 10px; font-weight:500; }
.btn.link { background:none; border:0; color:#fff; padding:0; text-decoration:underline; font-weight:400; font-size:14px; }
:focus-visible { outline:3px solid var(--primer); outline-offset:2px; }
label { display:block; font-weight:700; font-size:14px; margin-bottom:6px; }
label .opt { font-weight:400; color:var(--sub); font-size:12px; margin-left:6px; }
label .req { font-weight:700; color:var(--primer); font-size:12px; margin-left:6px; }
input[type=text], input[type=password], input[type=date], select, textarea { width:100%; font:16px/1.5 inherit; padding:11px 12px; border:1px solid #aab7c4; border-radius:4px; background:#fff; color:var(--ink); }
textarea { resize:vertical; min-height:7em; }
input[type=file] { font:14px/1.4 inherit; max-width:100%; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:16px 20px; }
.grid > * { min-width:0; }
.grid .full { grid-column:1 / -1; }
.hint { font-size:12px; color:var(--sub); margin-top:4px; }
.ferr { font-size:13px; color:var(--primer); font-weight:700; margin-top:4px; }
.note { font-size:14px; color:var(--sub); margin:0 0 12px; }
.actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:20px; align-items:center; }
.head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
.head h1 { margin:0; }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
.chip { font-size:14px; padding:7px 14px; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:999px; text-decoration:none; }
.chip.on { background:var(--steel); border-color:var(--steel); color:#fff; }
.folder { font-size:17px; margin:26px 0 0; padding:9px 14px; background:var(--steel); color:#fff; }
.folder small { font-weight:400; font-size:13px; margin-left:8px; opacity:.85; }
.files { list-style:none; margin:0; padding:0; background:var(--paper); border:1px solid var(--line); border-top:0; }
.files li { display:grid; grid-template-columns:54px minmax(0,1fr) auto; gap:6px 16px; align-items:center; padding:13px 14px; border-bottom:1px solid var(--line); }
.files li:last-child { border-bottom:0; }
.ext { font-family:inherit; font-weight:700; font-size:12px; line-height:1; letter-spacing:.04em; text-align:center; padding:8px 2px; color:#fff; background:var(--sub); border-radius:2px; text-transform:uppercase; }
.ext.pdf { background:var(--primer); } .ext.xls, .ext.xlsx, .ext.xlsm, .ext.csv { background:#2c7566; } .ext.doc, .ext.docx { background:var(--steel); }
.ftitle { font-weight:700; font-size:16px; line-height:1.5; overflow-wrap:anywhere; }
.ftitle a { color:inherit; }
.fmeta { font-size:13px; color:var(--sub); overflow-wrap:anywhere; }
.fops { display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; }
.ccount { display:inline-block; font-size:12px; font-weight:700; color:var(--steel); border:1px solid var(--steel); border-radius:999px; padding:1px 9px; margin-left:6px; white-space:nowrap; }
dl.confirm { display:grid; grid-template-columns:7em minmax(0,1fr); gap:6px 14px; margin:14px 0 0; }
dl.confirm dt { color:var(--sub); font-size:14px; }
dl.confirm dd { margin:0; overflow-wrap:anywhere; }
.feed { list-style:none; margin:0; padding:0; }
.feed li { display:grid; grid-template-columns:5.5em minmax(0,1fr); gap:4px 12px; padding:10px 0; border-bottom:1px solid var(--line); }
.feed li:last-child { border-bottom:0; }
.kind { font-size:12px; font-weight:700; text-align:center; padding:3px 4px; border-radius:2px; color:#fff; background:var(--sub); align-self:start; margin-top:3px; }
.kind.ev { background:var(--ok); } .kind.doc { background:var(--primer); } .kind.th { background:var(--steel); } .kind.cm { background:#5a4b8c; }
.feed .t { font-weight:700; overflow-wrap:anywhere; }
.feed .m { font-size:13px; color:var(--sub); }
.two { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.two > * { min-width:0; }
.evlist { list-style:none; margin:0; padding:0; }
.evlist li { display:grid; grid-template-columns:9.5em minmax(0,1fr); gap:4px 14px; padding:11px 0; border-bottom:1px solid var(--line); }
.evlist li:last-child { border-bottom:0; }
.evlist .d { font-weight:700; color:var(--steel); font-size:14px; }
.evlist .t { font-weight:700; overflow-wrap:anywhere; }
.evlist .m { font-size:13px; color:var(--sub); overflow-wrap:anywhere; }
.calnav { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-bottom:12px; }
.calnav strong { font-size:22px; margin-right:auto; }
.calwrap { overflow-x:auto; }
table.cal { width:100%; min-width:640px; border-collapse:collapse; table-layout:fixed; background:var(--paper); }
.cal th { font-size:13px; font-weight:700; padding:6px; background:var(--mist); border:1px solid var(--line); }
.cal th:first-child, .cal td:first-child .dn { color:var(--primer); }
.cal th:last-child, .cal td:last-child .dn { color:var(--steel); }
.cal td { vertical-align:top; height:96px; padding:4px 5px; border:1px solid var(--line); font-size:12px; }
.cal td.out { background:#f7f9fb; }
.cal td.out .dn { opacity:.4; }
.cal td.today { background:#fff8e6; }
.cal .dn { display:block; font-weight:700; font-size:13px; }
.cal a.ev { display:block; margin-top:3px; padding:2px 5px; background:#e3edf6; border-left:3px solid var(--steel); color:var(--ink); text-decoration:none; line-height:1.4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cal a.ev:hover { background:#cfe0ef; }
.post { background:var(--paper); border:1px solid var(--line); padding:18px 20px; margin-bottom:12px; min-width:0; }
.post.main { border-top:3px solid var(--steel); }
.post .by { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; font-size:13px; color:var(--sub); margin-bottom:8px; }
.post .by b { color:var(--ink); font-size:15px; }
.post .by b.office { color:var(--primer); }
.post .text { overflow-wrap:anywhere; line-height:1.85; }
.post .ops { display:flex; gap:6px; margin-top:10px; }
.threads { list-style:none; margin:0; padding:0; background:var(--paper); border:1px solid var(--line); border-top:3px solid var(--steel); }
.threads li { padding:14px 16px; border-bottom:1px solid var(--line); }
.threads li:last-child { border-bottom:0; }
.threads .t { font-weight:700; font-size:16px; overflow-wrap:anywhere; }
.threads .m { font-size:13px; color:var(--sub); }
table.acc { width:100%; min-width:720px; border-collapse:collapse; background:var(--paper); }
.acc th, .acc td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:middle; }
.acc thead th { background:var(--mist); font-size:12px; color:var(--sub); font-weight:500; white-space:nowrap; }
.acc td.name { font-weight:700; }
.acc code { font:15px Consolas,"Courier New",monospace; }
.st { display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:2px; white-space:nowrap; }
.st.on { background:#e9f4f1; color:var(--ok); } .st.off { background:#fbece8; color:var(--primer); } .st.none { background:var(--mist); color:var(--sub); }
.inline { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.inline form { margin:0; }
@media (max-width:760px) { .two { grid-template-columns:1fr; } }
@media (max-width:640px) {
  .grid { grid-template-columns:1fr; }
  .files li { grid-template-columns:48px minmax(0,1fr); } .fops { grid-column:1 / -1; justify-content:flex-start; }
  .evlist li { grid-template-columns:1fr; }
  .tabs a { padding:10px 11px; font-size:14px; }
}
</style>
</head>
<body>
<header class="bar"><div class="in">
  <div><strong>組合員専用ページ</strong><small>秋田県鐵構工業協同組合</small></div>
  <nav>
    <span class="who">千代田興業(株) でログイン中</span>    <a href="#">ホームページへ戻る</a>
            <a href="p09.html">パスワード変更</a>
    <form method="post" action="?"><input type="hidden" name="csrf" value="4d13da4704956b0faed127070a796ed4d6315345a9efe03d8db6be9d01d691d0"><input type="hidden" name="do" value="logout"><button class="btn link" type="submit">ログアウト</button></form>
      </nav>
</div></header>
<nav class="tabs" aria-label="専用ページのメニュー"><div class="in">
  <a href="p11.html">トップ</a><a href="p19.html">予定</a><a href="p21.html">資料</a><a href="p23.html" class="on" aria-current="page">掲示板</a></div></nav>
<main class="in">
<h1>新しい話題を立てる</h1><form class="card" method="post" action="?"><input type="hidden" name="csrf" value="4d13da4704956b0faed127070a796ed4d6315345a9efe03d8db6be9d01d691d0"><input type="hidden" name="do" value="thread_save"><input type="hidden" name="id" value=""><div class="grid"><div class="full"><label for="f-title">題名<span class="req">必須</span></label><input type="text" id="f-title" name="title" value="" maxlength="100" placeholder="例：溶接ロボットの導入について教えてください" autocomplete="off"></div><div class="full"><label for="f-body">本文<span class="req">必須</span></label><textarea id="f-body" name="body" rows="8" maxlength="4000"></textarea></div></div><p class="hint">書き込みには「千代田興業(株)」と表示されます。</p><div class="actions"><button class="btn" type="submit">話題を立てる</button><a class="btn line" href="p23.html">やめて戻る</a></div></form></main>

<div style="position:sticky;bottom:0;z-index:50;background:#fff7e0;border-top:2px solid #d9a400;color:#5a4300;font:13px/1.6 'Noto Sans JP',Meiryo,sans-serif;padding:8px 16px;text-align:center">見本の画面です。入力や保存をしても実際の名簿・予定・資料・書き込みは変わりません。</div>
<script>
(() => {
  const NEXT = {"login":"p11","logout":"p10","mypw":"p11","thread_save":"p24","comment_add":"stay","comment_edit":"stay","comment_delete":"stay"};
  // ▲▼は、本物と同じようにその場で入れ替えて見せる
  const refresh = box => {
    const items = [...box.parentElement.querySelectorAll(":scope > ." + box.classList[0])].filter(x => x.querySelector('button[name="mv"]'));
    items.forEach((x, i) => {
      x.querySelector('button[value$="up"]').disabled = i === 0;
      x.querySelector('button[value$="down"]').disabled = i === items.length - 1;
    });
  };
  const notice = text => {
    let m = document.getElementById("demo-msg");
    if (!m) { m = document.createElement("div"); m.id = "demo-msg"; m.className = "msg"; m.setAttribute("role", "status"); document.querySelector("main").prepend(m); }
    m.textContent = text;
    m.scrollIntoView({ block: "center" });
  };
  document.addEventListener("submit", e => {
    e.preventDefault();
    const sb = e.submitter;
    if (sb && sb.name === "mv") {
      const box = sb.closest(".pphoto, .prow");
      const up = sb.value.endsWith("up");
      const other = up ? box.previousElementSibling : box.nextElementSibling;
      if (other && other.classList.contains(box.classList[0]) && other.querySelector('button[name="mv"]')) {
        up ? box.parentElement.insertBefore(box, other) : box.parentElement.insertBefore(other, box);
        refresh(box); notice("並び順を変えました。（入力中の内容も保存しました）");
      }
      return;
    }
    const d = e.target.querySelector('[name="do"]');
    const to = d && NEXT[d.value];
    if (to === "stay") { notice("見本のため、書き込みは保存されません。実際は、ここに会社名つきで表示されます。"); return; }
    if (to) location.href = to + ".html";
  });
  document.addEventListener("click", e => { const a = e.target.closest('a[href="#"]'); if (a) e.preventDefault(); });
})();
</script>
</body>
